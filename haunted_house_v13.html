<!--
  THE HOLLOW HOUSE  -  v13, a haunted house for 100+ players

  v13 - IT SEES YOU COMING:
    * EVERYTHING IS A MODEL. Every monster, face, hand, eye, shadow and
      candle is a sculpted .glb now (they sit in the repo next to the other
      models - CFG.MODEL_BASE_V13 - and the new mp3s next to the old ones).
      The monsters are rigs - heads turn and cock, limbs crawl, legs stride,
      the chainsaw shakes:
        the GRINNER (too tall, a grin from ear to ear), the CRAWLER (all
        fours, spider-long limbs), the CHAINED ONES (three metres of shroud
        dragging chains), the DOLLS (cracked porcelain, one glass eye), the
        BUTCHER (sack hood, chainsaw), and THE THING IN THE CIRCLE.
    * SCARES FIRE BEFORE YOU REACH THEM. The floors report where everyone
      is four times a second (CFG.TRACK_MS); when you're walking at a scare
      and will reach it within CFG.EARLY_S seconds it goes off then, so it's
      happening in front of you as you arrive, not behind you after you've
      passed. Every fixed scare has been retimed to land within about a
      second, aimed at where you ARE (and in front of you). The front doors,
      the catwalk lurch, the cellar lockdown, the mausoleum slam and the
      attic circle still wait until you're standing on them.
    * SOMETHING WALKS BEHIND YOU (CFG.FOLLOWERS): footsteps and chains a
      few metres back, keeping pace. Stop and it stops. Walk back at it and
      it's gone. Sometimes it ends right behind you, screaming in your ear.
    * CLOSER EVERY TIME (CFG.FLASH_CLOSER): she flashes up behind you -
      nine metres, seven, five, four, three, two - then she's in your face.
    * THE DIRECTOR (CFG.DIRECTOR): every player in the house gets a scare
      every CFG.SCARE_EVERY ms, a different kind each time, always AHEAD of
      them: something crawls at you out of the dark and rears up, bursts out
      of the wall, walks across the room in front of you, drops out of the
      ceiling upside down, hands come up out of the floor, or a whisper and
      it's right behind you.
    * THE DOLLS: only their heads turn to follow you now - much further
      round than a head should (CFG.DOLL_HEAD_MAX). In the doll room every
      head snaps round, crack by crack, and one is suddenly right in front of
      you with its head on its side. The dress forms are life-size dolls.
    * THE WALL OF THE DEAD (CFG.WALL_OF_DEAD): the morgue's walls, ceiling
      and floor are covered in the dead, crawling at your head under a red
      strobe - then they're all gone at once.
    * THE SUMMONING (CFG.SUMMONING): in the attic circle the drone starts,
      hands claw up round you, and something three metres tall rises out of
      the floor in front of you and leans down. Then she's behind you.
    * THE BUTCHER chases you with the saw screaming; when he gets you the saw
      goes in, blood sprays across the floor and up the wall
      (CFG.BLOOD_STAYS), and he's gone - for now. The Reaper is a chained one.
    * Chained ones PATROL the attic and the catacombs (CFG.PATROL).
    * The catwalk and the swing's branch are models now, not grey boxes.
    * No position probe anywhere (Otherside doesn't run them).
    * TRIANGLES: Otherside stops at 1,000,000 for the whole deed. The house,
      yard, rocks and rooms are trimmed copies now (_v13): every triangle
      that can never be seen from anywhere a player or the camera can be -
      rock buried in rock, below the world's floor, the backs of things
      against walls - is gone (182k of them). Nothing you can see changed.
      The bride, the parlor shadow, the attic pacer and the grave hand are
      lent to the scares whenever nobody could notice they're gone, so no
      spare copies are needed. The Butcher, the thing in the attic and the
      Wall of the Dead's corpses only exist while they're on stage (and
      the summoning and the Wall never run at the same instant).
      ~900k with everything, ~960k at the very worst moment.

  v12 - THEY WATCH YOU:
    * Every doll in the nursery and every dress form in the doll room
      turns to face whoever is nearest, and keeps turning to follow them
      as they walk through. Each one turns at its own speed, so they come
      round one after another. When the room empties they slowly turn
      back to where they were. The room's own floor plates (the ones the
      strobes already use) tell them where people are - no probe, since
      Otherside only reports people standing on something of the build's.
    * Dials: CFG.DOLLS_WATCH (off = v11), CFG.DOLLS_TURN_MS (how long a
      turn takes), CFG.DOLL_FACE_OFFSET (if they end up facing the wrong
      way, try 180 or 90).
    * The old one-off turns on the nursery and doll room triggers are
      gone (their sounds and flicker are still there) - the dolls never
      stop watching now. The dress forms still creep closer in the dark.

  v10 - ON THE ROCKS:
    * v9's hill is gone. The lot is still lifted 7 m (CFG.ELEVATE), but
      now it sits on a ring of big mossy boulders hugging the fence, from
      the world's floor up to the yard, with smaller ones scattered round
      the foot. From outside you can't see under the yard or into the
      cellars any more - there's also a dark wall hidden behind the rocks
      in case anything ever peeks between them.
    * A stone staircase goes up to the front gate (two flights with a half
      landing, side walls, coping and newel posts with candles), and another
      comes down from the back exit, built from the house's own stone.
    * The yard's ground and the mist now stop just past the fence, so
      nothing hangs off the edge in mid-air.
    * New models for the repo: lot_base.glb (rocks + stairs),
      grounds_v10.glb and fog_ground_v10.glb. mountain.glb isn't used.

  v8 - UP OFF THE GROUND:
    * The cellars, the tunnel and the mausoleum stairs go 6 m below the
      yard, so they poked out under the world's floor. The whole lot now
      stands on a raised plateau (CFG.ELEVATE metres up, 7 by default): an
      earth bank all round the edge, and a ramp up to the front gate and
      another down from the back exit. Nothing below the yard reaches the
      world's ground any more.

  v7 - LOCKED IN:
    * You can SEE the front doors slam shut behind you now. The real doors
      sit in the wall, a hair behind the foyer's black box, so from inside
      they just vanished into the dark. Now a pair of doors hangs a step
      inside the doorway, in front of the black, and slams with the real
      ones. Turn round and there they are, shut, with a faint cold light
      on them so you can see them even in the blackout - and they stay
      shut until the lock lets go (CFG.LOCKED_DOORS_SEEN,
      CFG.LOCKED_DOOR_LIGHT, CFG.LOCKED_DOOR_COLOR).
    * The rainbow church glass is gone. The big window over the porch is
      blood-red glass now, cracked and smeared, with the shadow of
      something tall standing behind it - glowing eyes, hands pressed flat
      on the glass. The little round window up in the gable is a huge
      bloodshot eye with a slit pupil, crying blood, watching the yard.
      Lightning through it floods the foyer red. (New shells:
      house_outside_v7.glb, house_upper_v7.glb, house_attic_v7.glb - they
      go in the repo next to the old ones.)

  v6 - THE DARK:
    * The whole house now stays as black as the foyer is when the front doors
      slam. Every room sits inside its own black inside-out box (the same
      thing that does the foyer blackout), so walls, ceilings and windows
      vanish. The lights in the house are off between flashes
      (CFG.DARK_HOUSE, CFG.HOUSE_LIGHTS_ON).
    * It flashes a lot. Every room with someone in it pops a light near
      somebody every couple of seconds, and often the whole room flashes up -
      walls, furniture and sometimes whatever is standing in there - and then
      it's gone (CFG.FLASH_EVERY, CFG.FULL_FLASH, CFG.FLASH_MONSTER).
      Lightning flashes the foyer through the stained glass and the rooms
      people are in. Every scare that used to flicker the lights now flashes
      the room.
    * The floor is dimly lit along the way through: a faint pale glow on the
      boards from door to door, round every corner, through the library and
      wine cellar shelves, the mirror maze and down the tower landings, so you
      always know which way to walk (CFG.FLOOR_GLOW).
    * Upstairs is a loop now. The walkway on the right of the grand staircase
      used to run into the front wall; now both walkways climb a short flight
      of steps at the front and a wooden catwalk crosses in front of the
      stained glass. The glowing floor takes you right, over the catwalk and
      back to the master bedroom. Something crosses it ahead of you, and
      halfway over it lurches and hands come up through the railings
      (CFG.CATWALK).
    * Writing on the walls, in blood (pictures, not text): YOUR NFTs ARE
      GOING TO ZERO in the foyer, NGMI in the tower, WEN EXIT? by the way out
      of the cellars (CFG.WALL_WRITING).
    * The swing hangs from a branch of its tree now (CFG.SWING_TOP).

  v5 - A TOUR, NOT A FUNHOUSE:
    * The house is much darker (CFG.HOUSE_DARK). Every door you're meant to
      take has a floating candle beside it - follow the candles.
    * The front doors open onto pure black: from the porch you can't see a
      thing inside. Step in, the doors slam, you're held in the dark for a
      few seconds, ankle-deep mist creeps across the floor, and the foyer
      sputters up from black to barely-visible with lights flashing here
      and there.
    * Only ONE pitch-black room now (CFG.PITCH_BLACK, the doll room). A trail
      of candles leads through it and something whispers from the way out.
      The library, nursery, wine cellar and morgue are dim instead, and
      still strobe.
    * The bottom of the tower: an arrow on the end wall, THIS WAY over the
      door, a red glow through it, and when you reach the landing the gate
      rattles and a hand beckons you in.
    * Lights flash near wherever people are walking, and now and then
      footsteps follow a little way behind you.
  ===========================================================================
  A four-storey Victorian mansion on a 100 x 120 m fenced lot. The way through
  is one-way so a crowd keeps moving:

    GATE -> drive (hedges, the hearse), graveyard (open graves, the gallows),
            pumpkin patch, fountain -> PORCH
    side trip: THE MAUSOLEUM -> stairs down -> a 70 m tunnel under the yard
            -> the hatch bursts open in the pumpkin patch and the REAPER rises
    GROUND:   foyer (the front doors lock behind you) -> parlor -> library ->
              dining hall -> kitchen -> seance room -> up the grand staircase
    UPPER:    gallery -> master bedroom -> nursery -> HALL OF MIRRORS (five
              scares) -> bathroom -> doll room -> attic stairs
    ATTIC:    the ritual -> the tower door
    TOWER:    NO WAY BACK - the cage, the dark, all the way down
    BASEMENT: LOCKDOWN - both doors slam, the BUTCHER climbs out of his coffin
              and hunts everyone in the cellars -> catacombs -> wine cellar ->
              boiler room -> laboratory -> morgue -> the well -> up the ramp
              into the back graveyard -> exit gate

  Everything you see is in the .glb files (upload the "models" folder and set
  CFG.MODEL_BASE). The walls, floors and furniture you bump into are invisible
  boxes made here, so they always line up with the models.

  SOUND IS LOCAL TO THIS BUILD (same system as the Mars Cat Anniversary Hall):
  every solid surface on the lot reports who is standing on it, and all the
  sound lives in groups that are only sent to those players. Walk out of a gate
  onto the doorstep and you stop hearing it. An empty lot sends sound to nobody
  ("-1"). Every sound is a fresh player made at the moment it starts and removed
  when it ends - nothing waits for a future start time. The music is split into
  one-minute parts, each a fresh player started when its part begins.

  THE DIALS ARE ALL IN CFG BELOW.
-->

  //  WHO IS ON THE LOT  (same as the Mars Cat hall)
  // ==================================================================
  // Every solid thing on the lot (ground, floors, stairs, walls...) reports
  // when a player touches it. Stepping onto a doorstep outside a gate counts
  // as leaving.
  const inside = new Map();   // player connection id -> last time seen on the lot
  let onInsideChange = () => {};
  function seen(id) {
    const isNew = !inside.has(id);
    inside.set(id, document.timeline.currentTime);
    if (isNew) onInsideChange();
  }
  function gone(id) { POS.delete(id); if (inside.delete(id)) onInsideChange(); }
  // v5: roughly where each player is (from the floor they're touching), and
  // which way they've been walking - used for the flashing lights and the
  // footsteps that follow people.
  const POS = new Map();
  function here(id, x, y, z) {
    const t = document.timeline.currentTime;
    let q = POS.get(id);
    if (!q) { q = { id, ax: x, az: z, at: t, hx: 0, hz: 0, vx: 0, vz: 0, fx: 0, fz: 0, lx: x, lz: z, lt: t }; POS.set(id, q); }
    // v13: speed and direction from the last two reports (smoothed), so a scare can see you coming
    const dt = (t - q.lt) / 1000;
    if (dt > 0.12) {
      if (dt < 1.6) {
        const vx = (x - q.lx) / dt, vz = (z - q.lz) / dt, sp = Math.hypot(vx, vz);
        if (sp < 12) { q.vx = q.vx * 0.35 + vx * 0.65; q.vz = q.vz * 0.35 + vz * 0.65; }
      } else { q.vx = 0; q.vz = 0; }
      const s = Math.hypot(q.vx, q.vz);
      if (s > 0.6) { q.fx = q.vx / s; q.fz = q.vz / s; }   // the way they were last going (kept when they stop)
      q.lx = x; q.lz = z; q.lt = t;
    }
    q.x = x; q.y = y; q.z = z; q.t = t;
    if (t - q.at > 1500) {
      const dx = x - q.ax, dz = z - q.az, d = Math.hypot(dx, dz);
      if (d > 0.8) { q.hx = dx / d; q.hz = dz / d; } else { q.hx = 0; q.hz = 0; }
      q.ax = x; q.az = z; q.at = t;
    }
  }

    const k = stale > 1.5 ? 0 : Math.min(1.2, stale + (ahead || 0));
    return { id, x: q.x + q.vx * k, y: q.y, z: q.z + q.vz * k, vx: q.vx, vz: q.vz, speed: stale > 1.5 ? 0 : Math.hypot(q.vx, q.vz), q };
  }

  function doorTo(n, to, ms, ease) {
    if (!n) return;

    if (n.__lerp) { n.__lerp.setAttribute("duration", Math.round(ms)); n.__lerp.setAttribute("easing", ease || "easeInOutQuad"); }

  // ==================================================================
  //  LIGHTS

  const VEIL = {};

  // ---- the floor glow: a faint pale light on the boards along the way through
  // [floor y, [x, z], [x, z], ...] - worked out from the walls and furniture so it never runs under anything
  const FLOOR_PATHS = {"entry":[[0.6,[[0,-11.3],[0,-5.2]]]],"house":[[0.6,[[0.0,-5.2],[-17.3,-1.0],[-20.5,-0.6],[-18.5,8.8],[-14.2,11.4],[-11.1,16.2],[-9.7,19.9],[-7.2,20.5],[-6.6,19.1],[7.5,19.2],[9.1,20.0],[11.2,20.5],[16.5,15.2],[18.5,8.0],[9.2,-2.5],[5.1,-3.3],[0.0,-2.6]]],[6.8,[[0,10.9],[0.0,11.6],[7.5,11.2],[7.0,4.0],[7.3,-7.2],[7.4,-7.4]]],[6.8,[[-7.4,-7.4],[-7.2,-5.7],[-9.9,-4.8],[-11.6,-4.5],[-15.7,5.0],[-18.0,7.9],[-18.5,9.6],[-9.3,20.0],[-7.0,20.5],[-4.3,24.0],[-2.0,25.5],[-1.8,16.0],[1.6,18.9],[2.6,25.5],[5.9,23.3],[7.0,17.0],[8.4,20.0],[11.2,20.5],[18.0,12.0],[18.5,10.6],[22.2,-1.7],[24.1,-3.0],[25.5,-2.9]]],[12.2,[[25.5,8.7],[0.0,9.0],[-18.2,26.4],[-18.2,31.6]]],[10.075,[[-18.2,36.3],[-18.2,37.8],[-19.7,37.8]]],[7.95,[[-24.3,37.8],[-25.8,37.8],[-25.8,36.3]]],[5.825,[[-25.8,31.7],[-25.8,30.2],[-24.3,30.2]]],[3.7,[[-19.7,30.2],[-18.2,30.2],[-18.2,31.7]]],[1.575,[[-18.2,36.3],[-18.2,37.8],[-19.7,37.8]]],[-0.55,[[-24.3,37.8],[-25.8,37.8],[-25.8,36.3]]],[-2.675,[[-25.8,31.7],[-25.8,30.2],[-24.3,30.2]]],[-4.8,[[-19.7,30.2],[-18.2,30.2],[-18.2,28.6],[-18.2,26.3],[-17.0,22.3],[-17.0,14.5],[-18.5,4.0],[-15.6,0.0],[-12.5,-0.5],[-12.2,-3.7],[-12.5,-4.4],[0.5,-2.8],[11.2,-4.5],[18.5,11.4],[14.8,16.9],[8.8,20.0],[6.8,20.5],[0.0,27.3]]]],"catwalk":[[8.3,[[7.45,-10.45],[7.45,-11.05],[-7.45,-11.05],[-7.45,-10.45]]]]};

  // ---- things that are always there

  // ==================================================================
  //  LIGHTNING - strikes 30-60 m from the house, the flash on its own dial
  // ==================================================================
  const BOLTS = ["bolt0", "bolt1", "bolt2", "bolt3"].map((t) => ({ busy: false, node: img(t, 0, PARK, 0, 1, 3, { emissive: 1 }) }));
  const flashLight = (dist, color) => el("m-light", { type: "point", y: PARK, intensity: 0, distance: dist, color, "cast-shadows": "false" });
  const skyFlash = flashLight(170, "#c7d4ff");     // at the bolt

  const winFlash = flashLight(30, "#b9c8ff");      // and the upper floor
  const HOUSE = { x: 0, z: 8 };
  function strike(near) {
    const free = BOLTS.filter((b) => !b.busy);
    if (free.length < 2) return;
    const pair = [free[0], free[1]];
    pair.forEach((b) => (b.busy = true));
    const [d0, d1] = CFG.STRIKE_DISTANCE;
    // near strikes land in front of the house (where the crowd is); the rest anywhere round it
    const a = near ? lerp(-2.4, -0.75, rnd()) : rnd() * Math.PI * 2;
    const d = near ? lerp(d0, d0 + (d1 - d0) * 0.3, rnd()) : lerp(d0, d1, rnd());
    const x = HOUSE.x + Math.cos(a) * d, z = HOUSE.z + Math.sin(a) * d;
    const h0 = lerp(40, 70, rnd()), w = h0 / 3, ry = Math.round(rnd() * 180);
    // v10: off the edge of the raised lot the bolt carries on down to the world's floor
    const drop = CFG.ELEVATE && (Math.abs(x) > 52 || z < -66 || z > 58) ? CFG.ELEVATE : 0, h = h0 + drop;
    pair.forEach((b, i) => {
      const n = b.node;
      n.setAttribute("x", r(x)); n.setAttribute("z", r(z)); n.setAttribute("ry", ry + i * 90);
      n.setAttribute("width", r(i ? w * 0.85 : w)); n.setAttribute("height", r(h));
    });
    const steps = [[1, 90], [0, 70], [1, 160]];
    if (rnd() < 0.5) steps.push([0, 60], [1, 90]);
    const F = CFG.FLASH * (near ? 1.2 : 1);
    const showB = (on) => {
      pair.forEach((b) => b.node.setAttribute("y", on ? r(h / 2 - drop) : PARK));
      placeAt(skyFlash, x, on ? h * 0.4 : PARK, z); skyFlash.setAttribute("intensity", on ? r(F) : 0);
      placeAt(houseFlash, HOUSE.x + (x - HOUSE.x) * 0.45, on ? 14 : PARK, HOUSE.z + (z - HOUSE.z) * 0.45);
      houseFlash.setAttribute("intensity", on ? r(F * 0.5) : 0);
      placeAt(glassFlash, 0, on ? 9.5 : PARK, -9.0); glassFlash.setAttribute("intensity", on ? r(F * 0.006) : 0);
      placeAt(winFlash, 0, on ? 9.0 : PARK, 2.0); winFlash.setAttribute("intensity", on ? r(F * 0.004) : 0);
    };
    let t = 0;
    // v6: the flash comes in through the stained glass and lights the foyer, and every room people are in

  // A pad sits 4cm proud of the floor and is invisible from birth, so it

  // v13: SCARES THAT SEE YOU COMING. Every pad is also watched from a
  // distance: the floors report where everyone is four times a second, and
  // when someone is walking towards a pad and will reach it within
  // CFG.EARLY_S seconds (or is within CFG.EARLY_M metres and closing), it
  // fires THEN - so the scare is already happening as they arrive, not
  // behind them after they've passed. Stepping on the pad still fires it.
  // o.lead = how far out to watch (metres, 0 = only on the pad itself)
  const SPOTS = [];
  const LAST_SCARE = new Map();   // player -> when something last jumped at them (the director leaves them alone for a bit)
  function pad(x, y, z, w, d, fn, o) {
    o = o || {};
    const cool = o.cooldown !== undefined ? o.cooldown : CFG.COOLDOWN;
    const p = el("m-cube", { x: r(x), y: r(y + 0.0), z: r(z), width: w, height: 0.08, depth: d, color: "#000000",
      opacity: 0, collide: "true", "collision-interval": 100, "cast-shadows": "false" });
    const spot = { x, y, z, w, d, fn, o, cool, last: -1e9,
      lead: o.lead !== undefined ? o.lead : (o.noEarly ? 0 : CFG.EARLY_M) };
    SPOTS.push(spot);
    p.addEventListener("collisionstart", (e) => {
      seen(e.detail.connectionId);
      const q = e.detail.position; if (q) here(e.detail.connectionId, x + q.x, y + q.y, z + q.z);
      fireSpot(spot, e.detail.connectionId, false);
    });
    p.addEventListener("collisionmove", (e) => {
      seen(e.detail.connectionId);
      const q = e.detail.position; if (q) here(e.detail.connectionId, x + q.x, y + q.y, z + q.z);
    });
    return p;

  function fireSpot(s, id, early) {
    if (!CFG.SCARES && !s.o.always) return;
    const t = Date.now();

  const IN_Z = -11.55;   // the back of the door model is 0.17 deep: -11.55 keeps it 0.06 in front of the black
  const inDoors = CFG.LOCKED_DOORS_SEEN && CFG.MODEL_BASE
    ? [model("front_door", -2.2, PARK, IN_Z, 0, FRONT_OPEN[0]), model("front_door", 2.2, PARK, IN_Z, 0, FRONT_OPEN[1])] : [];
  inDoors.forEach((n) => {
    n.__lerp = el("m-attr-lerp", { attr: "ry", duration: 500, easing: "easeInOutQuad" }, n);
    n.__ang = +n.getAttribute("ry") || 0;
  });
  // a faint cold light on them, so they show up even in the blackout
  const lockLight = CFG.LOCKED_DOORS_SEEN && CFG.LOCKED_DOOR_LIGHT > 0
    ? el("m-light", { type: "point", x: 0, y: PARK, z: -10.2, intensity: r(CFG.LOCKED_DOOR_LIGHT * CFG.LIGHT), distance: 3.4,
        color: CFG.LOCKED_DOOR_COLOR, "cast-shadows": "false" }) : null;
  if (lockLight) anim(lockLight, "intensity", CFG.LOCKED_DOOR_LIGHT * CFG.LIGHT * 0.7, CFG.LOCKED_DOOR_LIGHT * CFG.LIGHT, 1700);
  const frontBlock = blocker(0, 0.6 + 1.95, -12.0, 4.4, 3.9, 0.5);
  // The front of the foyer is filled by a black box (the veil, stretched).
  // Its walls face inwards, so from outside you look through the doorway
  // straight into nothing, and once you're in it you can't see a thing.
  const ENTRY = { x0: -8.6, x1: 8.6, z0: -11.95, z1: -5.5, y0: 0.62, y1: 6.2 };
  const ENTRY_SY = (ENTRY.y1 - ENTRY.y0) / 4.13, ENTRY_Y = ENTRY.y0 - 0.02 * ENTRY_SY;
  const entryBox = CFG.MODEL_BASE ? model("veil", (ENTRY.x0 + ENTRY.x1) / 2, PARK, (ENTRY.z0 + ENTRY.z1) / 2) : null;
  if (entryBox) {
    entryBox.setAttribute("sx", r((ENTRY.x1 - ENTRY.x0) / 7));
    entryBox.setAttribute("sy", r(ENTRY_SY));
    entryBox.setAttribute("sz", r((ENTRY.z1 - ENTRY.z0) / 7));
  }
  function entryDark(on) {
    if (entryBox) entryBox.setAttribute("y", on ? r(ENTRY_Y) : PARK);
    if (ENTRY_GLOW) ENTRY_GLOW.setAttribute("y", on ? PARK : 0);   // the floor glow inside the door comes up with the room
  }
  entryDark(true);
  // while it's black, an invisible wall at the far side of the box so nobody walks out of the dark early
  const holdBlock = blocker(0, 0.6 + 1.95, -5.65, 18, 3.9, 0.3);
  // someone's still in the foyer proper (past the black box)
  const foyerBusy = () => housePlayers(10000).some((q) => q.y > 0 && q.y < 6 && Math.abs(q.x) < 9.2 && q.z > ENTRY.z1 && q.z < 14);
  // once the foyer's empty, the mist sinks back into the floor, ready for the next lot
  function settleFoyer() {
    if (frontState !== "open" || !foyerMistUp) return;
    if (foyerBusy()) return later(8000, settleFoyer);
    foyerMist(false);
  }
  let frontState = "open", frontReady = 0;
  function slamDoors(p) {
    if (!D.door_l || frontState !== "open" || Date.now() < frontReady) return;
    frontState = "locked"; foyerHeld = true;
    lock(holdBlock);
    entryDark(true);
    doorTo(D.door_l, FRONT_SHUT[0], 220, "easeInQuad");
    doorTo(D.door_r, FRONT_SHUT[1], 240, "easeInQuad");
    // v7: the inside pair comes out wide open and slams with them
    inDoors.forEach((n, i) => { n.setAttribute("y", 0.6); doorTo(n, FRONT_SHUT[i], i ? 240 : 220, "easeInQuad"); });
    later(200, () => {
      if (lockLight) lockLight.setAttribute("y", 3.0);
      lock(frontBlock);
      const px = p ? p.x : 0;
      // three slams at once: one right on the player, one in the doorway, one in the foyer
      [[px, 1.8, p ? p.z : -8], [0, 2.5, -11.8], [px, 4, -6]].forEach(([x, y, z]) => sfx("slam_max", x, y, z, CFG.DOOR_SLAM_VOLUME));
    });
    strike(true);
    later(350, () => sfx("thunder", 0, 6, -16, 1.5));
    const hb = sfx("heartbeat", 0, 1.6, -8.5, 1.3, true);
    later(1200, () => sfx("whisper", 0, 2.5, -8, 1));
    // still black: the mist starts creeping in round your feet (it glows, just)
    later(1400, () => { foyerMist(true); sfx("moan", 0, 1, -3, 0.7); });
    // and then the room crawls up out of the dark
    later(CFG.FOYER_BLACKOUT, () => {
      entryDark(false); foyerHeld = false;
      unlock(holdBlock);
      flicker(roomLights("foyer"), 1800);
      sfx("creak", 0, 4, -4, 0.9);
      for (let k = 0; k < 6; k++) later(250 + k * lerp(550, 1100, rnd()), () =>
        flashAt(lerp(-8, 8, rnd()), lerp(2.5, 5.5, rnd()), lerp(-10, 8, rnd()), k === 3 ? "#ff1a10" : "#dfe8ff", 1.3));
    });
    later(CFG.FOYER_BLACKOUT + 2500, () => stopSfx(hb));
    later(CFG.FRONT_LOCK, () => {
      entryDark(true);   // black again before the doors open for the next lot
      unlock(holdBlock);
      sfx("creak", 0, 2, -11, 1);
      unlock(frontBlock);
      doorTo(D.door_l, FRONT_OPEN[0], 2800);
      doorTo(D.door_r, FRONT_OPEN[1], 3000);
      // v7: the inside pair creaks open with them, then goes away (the real doors are right behind it)
      if (lockLight) park(lockLight);
      inDoors.forEach((n, i) => doorTo(n, FRONT_OPEN[i], i ? 3000 : 2800));
      later(3100, () => { if (frontState === "open") inDoors.forEach(park); });
      frontState = "open"; frontReady = Date.now() + CFG.FRONT_REARM;
      later(3000, settleFoyer);
    });
  }
  // the trigger is a few steps in and the full width of the room, so the doors shut behind the whole group
  pad(0, 0.6, -7.6, 17, 1.6, slamDoors, { cooldown: 1000, noEarly: true });

  // 2. PARLOR - the lady over the fire shows her real face and the fire roars
  pad(-21.5, 0.6, -1.5, 4.5, 5, () => {
    flare(L.parlor_fire, 3.5, 1600);
    unpark(ladyScream, ladyY);
    sfx("screech", -26, 3, -1.5, 1);
    later(1500, () => park(ladyScream));
  });

  // 3. LIBRARY - the lights die and something runs between the shelves (v13: while they're still stuttering)
  pad(-18.5, 0.6, 8.8, 3.2, 2.2, (p) => {
    const ls = roomLights("library");
    sfx("whisper", -18, 3, 14, 1);
    flicker(ls);
    later(500, () => blackout(ls, true));
    later(350, () => {
      const A = take("shade", "wraith", 1); if (!A) return;
      put(A.n, -26, 0.6, 14.5, 90);
      moveNow(A.n, "x", -26, -11, 900, "linear");
      later(300, () => flashAt(-18.5, 3.2, 14.5, "#dfe8ff", 1.2));
      sfx("moan", -18, 2, 14, 1);
      later(950, A.done);
    });
    later(2600, () => blackout(ls, false));
  });

  // 4. DINING - the candles go out, she's standing at the far end of the table... and then she's in your face
  pad(-7.2, 0.6, 20.5, 2.2, 3, (p) => {
    const ls = roomLights("dining"), fb = Object.assign({ dir: [1, 0] }, p);
    const hb = sfx("heartbeat", -6, 2, 20.5, 1, true);
    flicker(ls, 500); later(350, () => blackout(ls, true));
    const A = take("grin", 1);
    if (A) {
      later(380, () => {
        if (!A.ok()) return;
        const L = lookOf(p.id, fb), s = along(L, [L.hx, L.hz], 6.5, 0.8);
        put(A.n, s.x, 0.6, s.z, faceTo(s.x, s.z, L.x, L.z)); A.n.__neck.setAttribute("rz", -22);
        flashAt(s.x, 3.2, s.z, "#ff1a10", 1.3); sfx("whisper", s.x, 2, s.z, 1.1);
      });
      later(720, () => { if (A.ok()) park(A.n); });
      later(980, () => inYourFace(A, p.id, { fb, fy: 0.6, hold: 750 }));
    } else later(600, () => faceRush(p.id, { fb, fy: 0.6 }));
    later(2200, () => stopSfx(hb));
    later(3000, () => blackout(ls, false));
  });

  // 5. KITCHEN - the cauldron boils over and hands reach out of it
  pad(11.2, 0.6, 20.5, 2.2, 3, () => {
    flare(L.kitchen_cauldron, 4, 2600);
    sfx("slam", 18, 2, 27, 0.8);
    later(300, () => sfx("moan", 25.5, 1.5, 12.3, 1));
    takeN("hand", 2).forEach((h, i) => {
      put(h.n, 25.5 + (i ? 0.3 : -0.3), 0.9, 12.3 + (i ? 0.2 : -0.2), i * 60);
      moveNow(h.n, "y", 0.9, 2.4, 1100, "easeOutQuad");
      later(3000, h.done);

  });

  // 6. SEANCE - a three-metre chained thing rises out of the table... and comes for you
  pad(18.5, 0.6, 8.0, 3.2, 2.2, (p) => {
    flare(L.seance_ball, 4, 2200);
    sfx("whisper", 18.5, 2, -2, 1);
    const A = take("wraith", 1); if (!A) return;
    const L0 = lookOf(p.id, Object.assign({ dir: [0, -1] }, p));
    put(A.n, 18.5, 0.6 - 2.6, -2.0, faceTo(18.5, -2.0, L0.x, L0.z));

  // 7. GALLERY - every portrait opens its eyes
  const pEyes = [];
  [-1, 1].forEach((s) => [-8.5, -1.0, 5.5].forEach((z) => pEyes.push([img("eyes", s * 8.68, PARK, z, 0.5, 0.25, { ry: s > 0 ? -90 : 90, emissive: 1 }), 9.65])));
  pad(0, 6.8, 11.6, 6, 2, () => {
    pEyes.forEach(([e, y]) => unpark(e, y));
    sfx("whisper", 0, 8.5, 0, 1);
    later(4500, () => pEyes.forEach(([e]) => park(e)));
  });

  // ==================================================================
  //  v6: THE CATWALK. The gallery walkway on the right of the staircase used
  //  to run straight into the front wall. Now both walkways climb a short
  //  flight of steps at the front, and a wooden catwalk crosses in front of
  //  the stained glass, over the drop into the foyer. Upstairs is a loop, and
  //  the floor glow takes you round it the long way.
  // ==================================================================
  const CW_Y = 8.3, CW_Z0 = -11.75, CW_Z1 = -9.85, CW_FOOT = -8.0, CW_TOP = -10.6, CW_XI = 6.15, CW_XO = 8.8;
  const cwG = CFG.CATWALK ? group(0, 0, 0) : null;   // everything you see (so it can lurch)
  if (CFG.CATWALK) {
    const WOOD = "#2b1b11", DARKW = "#1a100a";
    if (MB13) m13("catwalk", 0, 0, 0, {}, cwG);   // v13: the catwalk is a model now (the invisible boxes you walk on stay)
    const part = MB13 ? () => null : (x, y, z, w, h, d, c, o) => el("m-cube", Object.assign({ x: r(x), y: r(y), z: r(z), width: r(w), height: r(h), depth: r(d),
      color: c, collide: "false", "cast-shadows": "false" }, o || {}), cwG);
    const solid = (x, y, z, w, h, d, o) => track(el("m-cube", Object.assign({ x: r(x), y: r(y), z: r(z), width: r(w), height: r(h), depth: r(d),
      color: "#000000", opacity: CFG.SHOW_COLLIDERS ? 0.35 : 0, collide: "true", "cast-shadows": "false" }, o || {})));
    const run = (CW_FOOT - CW_TOP) / 6, rise = (CW_Y - 6.8) / 6, slope = Math.atan2(CW_Y - 6.8, CW_FOOT - CW_TOP);
    // the deck, over the railings, in front of the glass
    part(0, CW_Y - 0.1, (CW_Z0 + CW_Z1) / 2, CW_XI * 2 + 0.02, 0.2, CW_Z1 - CW_Z0, WOOD);
    part(0, CW_Y - 0.17, CW_Z1 + 0.02, CW_XI * 2, 0.3, 0.06, DARKW);
    [-4.6, -1.5, 1.5, 4.6].forEach((x) => part(x, CW_Y - 0.65, CW_Z0 + 0.3, 0.26, 0.9, 0.6, DARKW));   // brackets on the wall
    // the railing on the drop side: posts, rails and balusters
    for (let k = 0; k <= 8; k++) part(-CW_XI + k * CW_XI / 4, CW_Y + 0.5, CW_Z1 - 0.07, 0.12, 1.0, 0.12, DARKW);
    for (let k = 0; k < 32; k++) if (k % 4) part(-CW_XI + k * CW_XI / 16, CW_Y + 0.5, CW_Z1 - 0.07, 0.04, 0.9, 0.04, DARKW);
    part(0, CW_Y + 1.03, CW_Z1 - 0.07, CW_XI * 2 + 0.1, 0.08, 0.15, WOOD);
    part(0, CW_Y + 0.08, CW_Z1 - 0.07, CW_XI * 2, 0.06, 0.08, DARKW);
    [-1, 1].forEach((s) => {
      const xc = s * (CW_XI + CW_XO) / 2, wd = CW_XO - CW_XI;
      // a short flight up from the walkway: five steps, then the landing
      for (let i = 0; i < 5; i++) {
        const top = 6.8 + (i + 1) * rise;
        part(xc, (6.8 + top) / 2, CW_FOOT - (i + 1) * run, wd, top - 6.8, run, WOOD);
      }
      const lz0 = CW_FOOT - 5.5 * run;
      part(xc, (6.8 + CW_Y) / 2, (lz0 + CW_Z0) / 2, wd, CW_Y - 6.8, lz0 - CW_Z0, WOOD);
      // handrail up the open side of the steps
      const hx = s * (CW_XI + 0.06), hz = (CW_FOOT + CW_TOP) / 2, hy = (6.8 + CW_Y) / 2 + 0.95;
      part(hx, hy, hz, 0.08, 0.08, Math.hypot(CW_FOOT - CW_TOP, CW_Y - 6.8) + 0.2, WOOD, { rx: r(slope * 180 / Math.PI) });
      [[CW_FOOT - 0.12, 6.8], [hz, (6.8 + CW_Y) / 2], [CW_TOP + 0.15, CW_Y]].forEach(([z, fy]) => part(hx, fy + 0.48, z, 0.11, 0.96, 0.11, DARKW));
      // what you walk on: a ramp up the steps, the landing, a guard along the drop
      const L = Math.hypot(CW_FOOT - CW_TOP, CW_Y - 6.8) + 0.4, t = 0.3;
      const mz = (CW_FOOT + CW_TOP) / 2 + 0.2 * Math.cos(slope), my = (6.8 + CW_Y) / 2 - 0.2 * Math.sin(slope);
      solid(xc, my - Math.cos(slope) * t / 2, mz - Math.sin(slope) * t / 2, wd, t, L, { rx: r(slope * 180 / Math.PI) });
      solid(xc, (6.8 + CW_Y) / 2, (CW_TOP + CW_Z0) / 2, wd, CW_Y - 6.8, CW_TOP - CW_Z0);
      solid(s * (CW_XI - 0.03), 8.1, (CW_FOOT + CW_Z1) / 2, 0.1, 2.6, CW_FOOT - CW_Z1 + 0.1);   // only where the steps run beside the drop
    });
    solid(0, CW_Y - 0.1, (CW_Z0 + CW_Z1) / 2, CW_XI * 2 + 0.1, 0.2, CW_Z1 - CW_Z0);
    solid(0, CW_Y + 0.55, CW_Z1 - 0.07, CW_XI * 2, 1.1, 0.14);
    // candles: one on each landing, one floating in front of the glass
    if (CFG.GUIDE_CANDLES) [[-8.3, -11.4], [8.3, -11.4], [0, -11.45]].forEach(([x, z]) => candleAt(x, CW_Y + 2.3, z));

    // 7b. THE CATWALK, FROM THE RIGHT-HAND WALKWAY - lightning, and something tall and chained crosses it ahead of you
    pad(7.45, 6.8, -3.0, 2.8, 2.4, () => {
      const A = take("wraith", "shade", 1);
      if (A) {
        put(A.n, 5.6, CW_Y, -10.95, -90);

      later(300, () => flicker(roomLights("foyer", "gallery"), 1400));
      const H = takeN("hand", 3);
      H.forEach((h, i) => later(380 + i * 140, () => {
        if (!h.ok()) return;
        const hx = px + (i - 1) * 0.9;
        put(h.n, hx, CW_Y - 0.3, CW_Z1 + 0.05, 0);
        moveNow(h.n, "y", CW_Y - 0.3, CW_Y + 0.75, 380, "easeOutBack");
      }));
      later(800, () => sfx("moan", px, CW_Y - 1, -9.6, 1.2));
      later(2600, () => { H.forEach((h) => h.done()); moveNow(cwG, "y", -0.08, 0, 1800); });
    }, { noEarly: true });
  }

  // 8. MASTER BEDROOM - the wardrobe bursts open, she's in the mirror... and then she's out of it
  pad(-11.6, 6.8, -4.5, 2.2, 3.2, (p) => {

  pad(-18.5, 6.8, 9.6, 3.2, 2.2, (p) => {

  // 10. HALL OF MIRRORS - faces in the mirrors, then one comes out at you
  const MFACES10 = [[-4.26, 18.4, -90], [-4.26, 20.2, -90], [-4.26, 22.0, -90], [-8.7, 16.5, 90], [-8.7, 25.5, 90]];
  pad(-7.0, 6.8, 20.5, 2.2, 3, (p) => {
    const hb = sfx("heartbeat", -7, 8, 20.5, 1, true);
    const M = takeN("mface", 5, 1);
    later(200, () => M.forEach((h, i) => { if (h.ok()) put(h.n, MFACES10[i][0], 6.8 + 1.75, MFACES10[i][1], MFACES10[i][2]); }));
    later(850, () => M.forEach((h) => h.done()));
    later(850, () => { faceRush(p.id, { from: [-4.4, 20.5], ms: 300, fy: 6.8, to: 0.5, fb: Object.assign({ dir: [1, 0] }, p) }); });

  // 10b. MIRROR HALL - she drops out of the ceiling right in front of you, lands, and lunges
  pad(-2.0, 6.8, 25.5, 3.2, 2.6, (p) => {
    const fb = Object.assign({ dir: [0, -1] }, p);
    sfx("whisper", -2, 9, 25.5, 1);
    const A = take("grin", 1); if (!A) return;
    const L0 = lookOf(p.id, fb), lp = livePos(p.id, 0.3) || L0, s = along(lp, [L0.hx, L0.hz], 1.9, 0.7);

  // 10c. MIRROR HALL - pitch black, something tall stands ahead with its eyes glowing... and runs at you
  pad(-1.8, 6.8, 16.0, 3.2, 2.6, (p) => {
    const fb = Object.assign({ dir: [0, -1] }, p), L0 = lookOf(p.id, fb);
    const hb = sfx("heartbeat", L0.x, 8, L0.z, 1.2, true);
    veil(L0.x, 6.8, L0.z, 2800);
    const S = take("shade", "wraith", 1), s = along(L0, [L0.hx, L0.hz], 2.4, 0.6);
    later(150, () => {
      if (S && S.ok()) { put(S.n, s.x, 6.8, s.z, faceTo(s.x, s.z, L0.x, L0.z)); lightAt(s.x, 7.3, s.z, 650, "#9fb4ff", 0.35, 4); }
      sfx("whisper", s.x, 8.5, s.z, 1);
    });
    later(850, () => { if (S) S.done(); faceRush(p.id, { from: [s.x, s.z], ms: 260, fy: 6.8, to: 0.45, fb, vol: 1.35 }); });
    later(2300, () => stopSfx(hb));

  // 10d. MIRROR HALL - faces flicker from mirror to mirror all round you, the glass breaks, and one comes through

  // ==================================================================
  //  MONSTERS THAT HUNT YOU
  //  v13: no position probe (Otherside doesn't run them). The floors say
  //  where everyone is (POS, four times a second), and the monster walks at
  //  the nearest player in its area (an m-attr-lerp smooths the steps).
  //  Catch someone and they get it right in the face, then it vanishes and
  //  comes up near someone else.
  //  o.get() hands it a body to use (o.put gives it back), and the hooks
  //  onStart / onStop / onCatch let each monster do its own thing.
  // ==================================================================
  const TICK = 200;
  function Hunter(o) {
    let H = null, timer = null, active = false, hidden = false, x = 0, z = 0, ry = 0, lastGrowl = 0, lerpN = null;
    const immune = new Map();
    const Z = o.zone;
    const inZone = (p) => p && p.x > Z.x0 && p.x < Z.x1 && p.z > Z.z0 && p.z < Z.z1 && p.y > Z.y0 && p.y < Z.y1;
    function body() { if (!H) H = o.get(); return H; }
    function setXZ(nx, nz, nry) {
      x = Math.min(Z.x1 - 0.5, Math.max(Z.x0 + 0.5, nx)); z = Math.min(Z.z1 - 0.5, Math.max(Z.z0 + 0.5, nz));
      if (nry !== undefined) { ry = near360(nry, ry); H.n.setAttribute("ry", Math.round(ry)); }
      H.n.setAttribute("x", r(x)); H.n.setAttribute("z", r(z));
    }
    function targets() {
      const t = now(), out = [];
      POS.forEach((q, id) => {
        if (t - q.t > 2500 || (immune.get(id) || 0) > t) return;
        const p = livePos(id);
        if (inZone(p)) out.push([id, p]);
      });
      return out;
    }
    function step() {
      if (!active || hidden || !H) return;
      const list = targets();
      if (!list.length) return;
      let best = null, bd = 1e9;

      t += lerp(1900, 2500, rnd());
    });
    later(t, () => {
      if (!A.ok()) { flashBusy = false; return; }
      const Q = lookOf(id); if (!Q) { A.done(); flashBusy = false; return; }
      let dir = [Q.hx, Q.hz];
      if (Q.speed < 0.5 && side) { const l = Math.hypot(side[0], side[1]) || 1; dir = [side[0] / l, side[1] / l]; }
      A.n.__neck.setAttribute("ry", 0);
      inYourFace(A, id, { dir, d: 0.8, cock: 40, hold: 900, veil: 1200 });
      later(1300, () => { flashBusy = false; });
    });
  }

  // ==================================================================
  //  v13: THE DIRECTOR. Every 0.6 s it looks for someone in the house who
  //  hasn't had a scare for a while and gives them one - a different kind
  //  each time (each player remembers what they've had). All of them
  //  happen AHEAD of you or right on you, never somewhere you've passed:
  //    crawl    - something on all fours comes skittering at you out of the
  //               dark and rears up in your face
  //    wallpop  - it bursts out through the wall ahead of you, then pulls back
  //    crossing - something tall walks across the room in front of you
  //    ceiling  - she drops out of the ceiling upside down, face at your face
  //    hands    - hands burst up out of the floor ahead of you
  //    behind   - a whisper in your ear... and it's right behind you
  // ==================================================================
  const NEXT_DIR = new Map();
  window.addEventListener("disconnected", (e) => NEXT_DIR.delete(e.detail.connectionId));
  // the nearest wall straight ahead (1.5-5.5 m away): the point on it, and which way is into the room
  function wallAhead(L, v) {
    let best = null;
    [["x", v.x0, 1], ["x", v.x1, -1], ["z", v.z0, 1], ["z", v.z1, -1]].forEach(([ax, w, nrm]) => {
      const h = ax === "x" ? L.hx : L.hz; if (Math.abs(h) < 0.2) return;
      const t = (w - (ax === "x" ? L.x : L.z)) / h; if (t < 1.5 || t > 5.5) return;
      const px = L.x + L.hx * t, pz = L.z + L.hz * t;
      if (ax === "x" && (pz < v.z0 + 0.8 || pz > v.z1 - 0.8)) return;
      if (ax === "z" && (px < v.x0 + 0.8 || px > v.x1 - 0.8)) return;
      if (!best || t < best.t) best = { t, x: px, z: pz, nx: ax === "x" ? nrm : 0, nz: ax === "z" ? nrm : 0 };
    });
    return best;
  }
  const SCARES13 = [
    { name: "crawl", can: (L, v) => L.speed > 0.3 && roomAhead(L, [L.hx, L.hz]) > 4.5, run(L, v) {
      const A = take("crawl", 1); if (!A) return false;
      const fy = floorAt(L), s = along(L, [L.hx, L.hz], Math.min(8, roomAhead(L, [L.hx, L.hz]) - 0.6), 0.6);
      let x = s.x, z = s.z, ry = faceTo(x, z, L.x, L.z);
      put(A.n, x, fy, z, ry);
      crawlAnim(A.n, 240); loopOn(A, "skitter", 1.3, 0.4);
      glide(A, 150);
      const lt = lightAt(x, fy + 1.4, z, 3200, "#b8c8ff", 0.45, 5);
      sfx("growl", x, fy + 0.8, z, 1.0);
      const t0 = now(); let k = 0;
      const timer = setInterval(() => {
        if (!A.ok()) return clearInterval(timer);
        const Q = livePos(L.id) || L, d = Math.hypot(Q.x - x, Q.z - z) || 1;
        if (lt) { lt.n.setAttribute("x", r(x)); lt.n.setAttribute("z", r(z)); lt.n.setAttribute("intensity", k++ % 3 === 0 ? lt.I : r(lt.I * 0.15)); }
        if (d < 1.3 || now() - t0 > 2600) {
          clearInterval(timer); if (lt) lt.off();
          stopSfx(A.it.loop); A.it.loop = null;
          return inYourFace(A, L.id, { fy, d: 0.9, hold: 650, dir: [(x - Q.x) / d, (z - Q.z) / d] });
        }
        const st = Math.min(1, 6.5 * 0.15 / d);
        x += (Q.x - x) * st; z += (Q.z - z) * st; ry = near360(faceTo(x, z, Q.x, Q.z), ry);
        A.n.setAttribute("x", r(x)); A.n.setAttribute("z", r(z)); A.n.setAttribute("ry", Math.round(ry));
      }, 150);
      return true;
    } },
    { name: "wallpop", can: (L, v) => !!VEIL[v.name] && !!wallAhead(L, v), run(L, v) {
      const W = wallAhead(L, v); if (!W) return false;
      const A = take("grin", "wraith", "shade", 1); if (!A) return false;
      const fy = floorAt(L), sx = W.x - W.nx * 0.6, sz = W.z - W.nz * 0.6, ex = W.x + W.nx * 0.3, ez = W.z + W.nz * 0.3;
      put(A.n, sx, fy, sz, faceTo(0, 0, W.nx, W.nz));
      later(60, () => {
        if (!A.ok()) return;
        moveNow(A.n, "x", sx, ex, 150, "easeOutBack"); moveNow(A.n, "z", sz, ez, 150, "easeOutBack");
        if (A.n.__neck) moveNow(A.n.__neck, "rz", 0, -30, 200, "easeOutQuad");
        sfx("slam_loud", ex, fy + 1.5, ez, 1.1); sfx("screech", ex, fy + 1.7, ez, 1.2);
        lightAt(ex + W.nx * 0.7, fy + 1.0, ez + W.nz * 0.7, 750, "#ff1a10", 1.1, 5);
      });
      later(800, () => { if (A.ok()) { moveNow(A.n, "x", ex, sx, 300, "easeInQuad"); moveNow(A.n, "z", ez, sz, 300, "easeInQuad"); } });
      later(1150, A.done);
      return true;
    } },
    { name: "crossing", can: (L, v) => roomAhead(L, [L.hx, L.hz]) > 4, run(L, v) {
      const A = take("wraith", "shade", 1); if (!A) return false;
      return crossAhead(A, L, Math.min(5.5, roomAhead(L, [L.hx, L.hz]) - 1));
    } },
    { name: "ceiling", can: (L, v) => v.y1 - floorAt(L) > 3.8 && roomAhead(L, [L.hx, L.hz]) > 2.8, run(L, v) {
      const A = take("grin", 1); if (!A) return false;
      const fy = floorAt(L), lp = livePos(L.id, 0.35) || L, s = along(lp, [L.hx, L.hz], 1.6, 0.6);
      A.n.__body.setAttribute("rz", 180);   // upside down, hanging by the feet
      const y0 = v.y1 + 2.2, y1 = fy + 3.5;
      put(A.n, s.x, y0, s.z, faceTo(s.x, s.z, lp.x, lp.z));
      moveNow(A.n, "y", y0, y1, 260, "easeInQuad");
      later(250, () => {
        if (!A.ok()) return;
        sfx("slam", s.x, fy + 3, s.z, 1.0); sfx("screech", s.x, fy + 1.7, s.z, 1.3);
        moveNow(A.n.__neck, "rz", 0, 30, 400, "easeOutQuad");
        lightAt((s.x + lp.x) / 2, fy + 0.4, (s.z + lp.z) / 2, 850, "#ff1a10", 1.2, 5);
      });
      later(1100, () => { if (A.ok()) moveNow(A.n, "y", y1, y0, 260, "easeInQuad"); });
      later(1400, A.done);
      return true;
    } },
    { name: "hands", can: (L, v) => roomAhead(L, [L.hx, L.hz]) > 2.5, run(L, v) {
      const H = takeN("hand", 5); if (H.length < 3) { H.forEach((h) => h.done()); return false; }
      const fy = floorAt(L), lp = livePos(L.id, 0.4) || L, px = -L.hz, pz = L.hx;
      H.forEach((h, i) => {
        const fwd = lerp(1.4, 2.8, rnd()), lat = (i - (H.length - 1) / 2) * 0.55 + lerp(-0.15, 0.15, rnd());
        const [hx, hz] = clampIn(roomOf(lp), lp.x + L.hx * fwd + px * lat, lp.z + L.hz * fwd + pz * lat, 0.4);
        later(i * 70, () => {
          if (!h.ok()) return;
          put(h.n, hx, fy - 0.95, hz, faceTo(hx, hz, lp.x, lp.z));
          h.n.setAttribute("rx", Math.round(lerp(-25, 10, rnd())));
          moveNow(h.n, "y", fy - 0.95, fy + 0.35, 280, "easeOutBack");
        });
        later(1500, () => { if (h.ok()) moveNow(h.n, "y", fy + 0.35, fy - 0.95, 500, "easeInQuad"); });
        later(2050, h.done);
      });
      lightAt(lp.x + L.hx * 2, fy + 0.7, lp.z + L.hz * 2, 1600, "#c8d4ff", 0.5, 5);
      sfx("knock", lp.x + L.hx * 2, fy, lp.z + L.hz * 2, 1.2); later(120, () => sfx("moan", lp.x + L.hx * 2, fy + 0.4, lp.z + L.hz * 2, 1.2));
      return true;
    } },
    { name: "behind", can: () => true, run(L, v) {
      const A = take("grin", "shade", 1); if (!A) return false;
      const fy = floorAt(L);
      sfx("whisper", L.x - L.hx * 0.7, fy + 1.7, L.z - L.hz * 0.7, 1.2);
      later(650, () => {
        if (!A.ok()) return;
        const Q = lookOf(L.id) || L, b = along(Q, [Q.hx, Q.hz], -1.1, 0.3);
        put(A.n, b.x, fy, b.z, faceTo(b.x, b.z, Q.x, Q.z));
        lightAt(b.x, fy + 2.2, b.z, 500, "#a8c0ff", 0.4, 4);
        sfx("knock", b.x, fy + 1.4, b.z, 0.7);
      });
      later(1150, A.done);
      return true;
    } },
  ];
  function director() {
    if (!CFG.DIRECTOR || !MB13) return;
    const t = now();
    const ids = candidates(2000).filter((id) => {
      if (!NEXT_DIR.has(id)) { NEXT_DIR.set(id, t + lerp(6000, 12000, rnd())); return false; }   // newcomers get a moment first
      return NEXT_DIR.get(id) < t && t - (LAST_SCARE.get(id) || -1e9) > 6000;
    });
    if (!ids.length) return;
    ids.sort((a, b) => NEXT_DIR.get(a) - NEXT_DIR.get(b));
    const id = ids[0], L = lookOf(id); if (!L) return;
    const v = roomOf(L);
    NEXT_DIR.set(id, t + lerp(CFG.SCARE_EVERY[0], CFG.SCARE_EVERY[1], rnd()));
    if (!v) return;
    const ok = SCARES13.filter((s) => s.can(L, v)).map((s) => s.name);
    for (const k of freshest(id, ok, "dir")) {
      if (SCARES13.find((s) => s.name === k).run(L, v)) { noteSeen(id, "dir", k); LAST_SCARE.set(id, t); return; }
    }
  }

  // ==================================================================
  //  v13: THE WALL OF THE DEAD. In the morgue the lights die, the black
  //  lifts off the walls and a red light strobes - and the walls, the
  //  ceiling and the floor are covered in the dead, all crawling towards
  //  your head. Then every one of them is gone at once: a white flash,
  //  black, a slam. The dead are only made when someone's on their way
  //  (the lab's scare gets them ready) and taken away afterwards, so they
  //  don't count against the triangle budget the rest of the time.
  // ==================================================================
  const MORGUE = { x0: 9.22, x1: 27.78, z0: 10.22, z1: 27.78, y0: -4.8, y1: 0.05 };
  let DEAD = null, deadT = null, deadBusy = false;
  function deadPrep() {
    if (!MB13 || !CFG.WALL_OF_DEAD) return;
    clearTimeout(deadT);
    deadT = setTimeout(deadClear, 30000);
    if (DEAD) return;
    DEAD = [];
    for (let i = 0; i < CFG.DEAD_COUNT; i++) {
      const outer = group(0, PARK, 0), inner = group(0, 0, 0, {}, outer), wig = group(0, 0, 0, {}, inner);
      m13(i % 2 ? "corpse_b_xlo" : "corpse_a_xlo", 0, 0, 0, {}, wig);
      DEAD.push({ outer, inner, wig, wa: null });
    }
  }
  function deadClear() {
    if (deadBusy) { deadT = setTimeout(deadClear, 30000); return; }
    if (DEAD) DEAD.forEach((c) => c.outer.remove());
    DEAD = null;
  }
  // [surface, outer turn, which world axes the corpse crawls in]
  const DEAD_SURF = { F: [{}, "x", "z"], C: [{ rx: 180 }, "x", "z"], W: [{ rz: -90 }, "y", "z"], E: [{ rz: 90 }, "y", "z"], N: [{ rx: -90 }, "x", "y"] };
  // the turn (inner ry) that points a corpse's head along (da, db) on its surface
  const DEAD_RY = { F: (a, b) => [a, b], C: (a, b) => [a, -b], W: (a, b) => [-a, b], E: (a, b) => [a, b], N: (a, b) => [a, b] };
  function wallOfDead(p) {
    if (deadBusy) return;
    if (BIG13) { deadBusy = true; return waitBig(() => { deadBusy = false; wallOfDead(p); }); }
    BIG13 = "wall";
    deadPrep(); deadBusy = true;
    const fb = Object.assign({ dir: [0, 1] }, p), M = MORGUE, ls = roomLights("morgue");
    blackout(ls, true);
    const L0 = lookOf(p.id, fb);
    const hb = sfx("heartbeat", L0.x, -3.4, L0.z, 1.3, true);
    sfx("slam", 27, -3.5, 19, 1.1);
    const ON = 350, CRAWL = 2600;
    later(ON, () => {
      if (VEIL.morgue) veilUp("morgue");
      const L = lookOf(p.id, fb);
      const T = { x: Math.min(M.x1 - 1, Math.max(M.x0 + 1, L.x + L.hx * 1.5)), y: M.y0 + 1.6, z: Math.min(M.z1 - 1, Math.max(M.z0 + 1, L.z + L.hz * 1.5)) };
      const order = ["W", "E", "N", "C", "F"];
      (DEAD || []).forEach((c, i) => {
        const S = order[i % order.length], [turn, a1, a2] = DEAD_SURF[S];
        const lo = { x: M.x0 + 0.6, y: M.y0 + 0.4, z: M.z0 + 0.6 }, hi = { x: M.x1 - 0.6, y: M.y1 - 0.5, z: M.z1 - 0.6 };
        // somewhere on its surface 3-6.5 m from where your head is (projected onto that surface)
        const ang = rnd() * Math.PI * 2, rad = lerp(3, 6.5, rnd());
        const pos = { x: T.x, y: T.y, z: T.z };
        pos[a1] = Math.min(hi[a1], Math.max(lo[a1], T[a1] + Math.cos(ang) * rad));
        pos[a2] = Math.min(hi[a2], Math.max(lo[a2], T[a2] + Math.sin(ang) * rad));
        const e = 0.02;
        if (S === "F") pos.y = M.y0 + e; if (S === "C") pos.y = M.y1 - e;
        if (S === "W") pos.x = M.x0 + e; if (S === "E") pos.x = M.x1 - e; if (S === "N") pos.z = M.z1 - e;
        const da = T[a1] - pos[a1], db = T[a2] - pos[a2], dd = Math.hypot(da, db) || 1;
        const go = Math.max(0.3, Math.min(dd - 0.9, lerp(0.6, 1.0, rnd()) * CRAWL / 1000));
        const end = { [a1]: pos[a1] + da / dd * go, [a2]: pos[a2] + db / dd * go };
        setA(c.outer, { rx: turn.rx || 0, rz: turn.rz || 0 });
        const [ra, rb] = DEAD_RY[S](da, db);
        c.inner.setAttribute("ry", Math.round(Math.atan2(ra, rb) * 180 / Math.PI));
        placeAt(c.outer, pos.x, pos.y, pos.z);
        later(i * 25, () => {
          moveNow(c.outer, a1, pos[a1], end[a1], CRAWL - i * 25, "linear");
          moveNow(c.outer, a2, pos[a2], end[a2], CRAWL - i * 25, "linear");
          c.wa = anim(c.wig, "rz", -8, 8, lerp(240, 360, rnd()));
        });
      });
      [[M.x0 + 1, 2.5, T.z], [M.x1 - 1, 2.5, T.z], [T.x, -0.5, M.z1 - 1]].forEach(([x, y, z], i) => sfx("skitter", x, y - 4.8 + 2.3, z, 1.4));
      later(300, () => sfx("moan", T.x, -2.5, T.z, 1.3));
      for (let k = 0; k * 170 < CRAWL; k++) later(k * 170, () => lightAt((M.x0 + M.x1) / 2, -1.2, (M.z0 + M.z1) / 2, 85, "#ff1208", 1.6, 24));
    });
    // every one of them gone at once
    later(ON + CRAWL, () => {
      (DEAD || []).forEach((c) => { stopMoves(c.outer); park(c.outer); if (c.wa) { c.wa.remove(); c.wa = null; } });
      if (DEAD) DEAD.forEach((c) => c.outer.remove());
      DEAD = null; clearTimeout(deadT);
      if (BIG13 === "wall") BIG13 = null;
      const L = lookOf(p.id, fb);
      lightAt(L.x, -2.2, L.z, 120, "#ffffff", 4, 26);
      later(120, () => { veil(L.x, -4.8, L.z, 1400); sfx("slam_loud", L.x, -3.3, L.z, 1.4); });
      stopSfx(hb);
    });
    later(ON + CRAWL + 1600, () => { if (VEIL.morgue) veilDown("morgue"); blackout(ls, false); deadBusy = false; clearTimeout(deadT); deadClear(); });
  }

  // ==================================================================
  //  v13: THE CHAINED ONES PATROL the attic and the catacombs - only while
  //  someone's in there, dragging their chains. Get too close and it's gone,
  //  and it comes back somewhere else.
  // ==================================================================
  const PATROLS = [
    { room: "attic", fy: 12.2, path: [[14, -6], [22, 4], [20, 18], [10, 22], [8, 2]] },
    { room: "catacombs", fy: -4.8, path: [[-24, 10], [-24, 24], [-13, 25], [-12, 12]] },
  ];
  PATROLS.forEach((P) => { P.h = null; P.i = 0; P.last = 0; P.hideUntil = 0; P.x = 0; P.z = 0; P.ry = 0; });
  function patrolTick() {
    if (!CFG.PATROL || !MB13) return;
    const t = now();
    PATROLS.forEach((P) => {
      const v = VEIL[P.room]; if (!v) return;
      const here = [];
      POS.forEach((q) => { if (t - q.t < 4000 && roomOf(q) === v) here.push(q); });
      if (here.length) P.last = t;
      if (P.h && !P.h.ok()) P.h = null;   // something more important took it
      if (!here.length) { if (P.h && t - P.last > 6000) { P.h.done(); P.h = null; } return; }
      if (t < P.hideUntil) return;
      // the waypoint furthest from everyone
      const far = () => P.path.map((w, i) => [i, Math.min(...here.map((q) => Math.hypot(q.x - w[0], q.z - w[1])))]).sort((a, b) => b[1] - a[1])[0][0];
      if (!P.h) {
        P.h = take("wraith", 0); if (!P.h) return;   // lowest priority: any real scare can borrow it
        P.i = far(); [P.x, P.z] = P.path[P.i]; P.ry = 0;
        put(P.h.n, P.x, P.fy, P.z, 0);
        loopOn(P.h, "ghost_walk", 1.1);
        const h = P.h; later(40, () => { if (h.ok()) glide(h, 320); });
        return;
      }
      if (+P.h.n.getAttribute("y") < -100) { P.i = far(); [P.x, P.z] = P.path[P.i]; unglide(P.h); put(P.h.n, P.x, P.fy, P.z); loopOn(P.h, "ghost_walk", 1.1); const h = P.h; later(40, () => { if (h.ok()) glide(h, 320); }); return; }
      // too close: gone
      if (here.some((q) => Math.hypot(q.x - P.x, q.z - P.z) < 1.5)) {
        sfx("whisper", P.x, P.fy + 1.8, P.z, 0.9); sfx("chain_rattle", P.x, P.fy + 1, P.z, 0.8);
        park(P.h.n); if (P.h.it.loop) { stopSfx(P.h.it.loop); P.h.it.loop = null; }
        P.hideUntil = t + 5000; return;
      }
      const [wx, wz] = P.path[(P.i + 1) % P.path.length], dx = wx - P.x, dz = wz - P.z, d = Math.hypot(dx, dz);
      if (d < 0.4) { P.i = (P.i + 1) % P.path.length; return; }
      const st = Math.min(d, 1.1 * 0.3);
      P.x += dx / d * st; P.z += dz / d * st; P.ry = near360(faceTo(0, 0, dx, dz), P.ry);
      setA(P.h.n, { x: P.x, z: P.z, ry: Math.round(P.ry) });
    });
  }

  // ==================================================================
  //  GO
  // ==================================================================
  later(2000, storm);
  later(6000, ambientEvent);
  later(9000, footsteps);
  later(25000, chainsaw);
  later(14000, redRoom);
  if (Object.keys(VEIL).length) setInterval(roomFlashes, 400); else later(5000, flashNearby);
  later(30000, stalker);
  // v13
  later(20000, follower);
  later(45000, flashCloser);
  setInterval(director, 600);
  setInterval(patrolTick, 300);
</script>
